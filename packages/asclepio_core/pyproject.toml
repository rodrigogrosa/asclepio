[project]
name = "asclepio-core"
version = "1.0.0"
description = "Núcleo compartilhado do Asclépio: anonimização, regras clínicas, guardrails, base de conhecimento e dados sintéticos"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6",
    "faker>=30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asclepio_core"]
