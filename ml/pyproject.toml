[project]
name = "asclepio-ml"
version = "1.2.0"
description = "Pipeline de ML do Asclépio — preparação de dados, anonimização, fine-tuning (LoRA), exportação para Ollama e avaliação"
requires-python = ">=3.11,<3.13"
dependencies = [
    "asclepio-core",
    "torch>=2.4",
    "transformers>=4.46",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=1.0",
    "trl>=0.12",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "evaluate>=0.4",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "httpx>=0.27",
    "langchain-ollama>=0.2",
    "langchain-core>=0.3",
    "gguf>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asclepio_ml"]
