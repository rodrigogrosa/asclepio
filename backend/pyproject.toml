[project]
name = "asclepio-api"
version = "1.0.0"
description = "API do Asclépio — FastAPI + LangChain + LangGraph (assistente clínico com LLM fine-tunada)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "asclepio-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.1.4",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "chromadb>=0.5.20",
    "langfuse>=2.50",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asclepio_api"]
